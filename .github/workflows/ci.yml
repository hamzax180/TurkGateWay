name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Security Audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check Type Safety
        run: npx tsc --noEmit

      - name: Run Linter
        run: npm run lint

      # Pure-logic tests: TOTP against RFC 6238 vectors, money conversion,
      # rate-limit tiers, plan invariants. No database or network, so this
      # needs no secrets and cannot flake.
      - name: Run Tests
        run: npm test

      - name: Build Application
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://mock:mock@localhost:5432/mock' }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
